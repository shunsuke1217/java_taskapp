<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
</head>
<body>
    <h1>タスク一覧</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>詳細</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}"></td>
            <td th:text="${task.title}"></td>
            <td th:text="${task.description}"></td>
            <td><form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}"><button type="submit">削除</button></form></td>
            <td><form method="get" th:action="@{/tasks/{id}/edit(id=${task.id})}"><button type="submit">編集</button></form></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/tasks/new}">新しいタスクを追加</a>
</body>
</html>
